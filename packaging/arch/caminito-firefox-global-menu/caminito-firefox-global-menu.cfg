// Firefox skips this first line of an autoconfig file. Caminito's Firefox global menu (ADR 0053).
//
// Firefox turns the dbusmenu "opened" the panel's applet sends into a popupshowing on its XUL
// menu, and the autohide Menu Bar toolbar shows itself for any popupshowing in it. The menubar
// is display: none while it's in the panel, so the toolbar is an empty strip above the tabs
// until something makes the menubar inactive, and the window's buttons, which move up to the
// shown toolbar, are hidden in the tab strip. While the menubar is native, a user sheet keeps
// the toolbar as Firefox keeps it when it's inactive, and the buttons where they were. A Menu
// Bar toolbar the user keeps shown has no autohide, and its buttons stay.
try {
  const css = `
    #toolbar-menubar[autohide]:not([customizing]):has(#main-menubar[native]) {
      min-height: 0 !important;
      height: 0 !important;
      padding: 0 !important;
      appearance: none !important;
    }
    #toolbar-menubar[autohide]:has(#main-menubar[native])
      ~ :is(#TabsToolbar, #nav-bar)
      > .titlebar-buttonbox-container {
      visibility: visible !important;
    }
  `;
  const io = Components.classes["@mozilla.org/network/io-service;1"].getService(
    Components.interfaces.nsIIOService,
  );
  const sheets = Components.classes["@mozilla.org/content/style-sheet-service;1"].getService(
    Components.interfaces.nsIStyleSheetService,
  );
  const uri = io.newURI("data:text/css;charset=utf-8," + encodeURIComponent(css));
  if (!sheets.sheetRegistered(uri, sheets.USER_SHEET)) {
    sheets.loadAndRegisterSheet(uri, sheets.USER_SHEET);
  }
} catch (error) {
  // An exception would have Firefox say at every start that it can't read its configuration.
  Components.utils.reportError(error);
}

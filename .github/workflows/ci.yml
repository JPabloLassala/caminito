name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install git
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v5

      - uses: ./.github/actions/arch-setup

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo-deny
        run: cargo deny check

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace --exclude camino

      # The palette helper against the colours Marco recorded, and live gtk-theme changes
      # (28). The colours don't depend on the GDK backend, so it runs on X under Xvfb.
      - name: Test the palette helper
        run: |
          meson setup target/meson
          meson compile -C target/meson
          CAMINO_GTK_PALETTE=$PWD/target/meson/helpers/camino-gtk-palette/camino-gtk-palette \
            xvfb-run -a cargo test -p camino-theme --test palette_helper -- --ignored

      # A golden case that doesn't match writes Camino's image and a diff beside it.
      - name: Keep golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: |
            tests/goldens/frames/**/*.camino.png
            tests/goldens/frames/**/*.diff.png
          if-no-files-found: ignore

      # The headless tier renders with pixman, so it needs no GPU or EGL, and the X11 tier
      # runs with it. camino's tests get a private session bus (14). The bus takes its home
      # from the user database (/root), and a container job's HOME is /github/home, so
      # XDG_DATA_HOME makes the bus read the service files that a test writes below HOME.
      - name: Test camino
        run: XDG_DATA_HOME=$HOME/.local/share dbus-run-session -- cargo test -p camino

name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install git
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v5

      - uses: ./.github/actions/arch-setup

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo-deny
        run: cargo deny check

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace --exclude caminito

      # The palette helper against the colours Marco recorded, and live gtk-theme changes
      # (28). The colours don't depend on the GDK backend, so it runs on X under Xvfb.
      - name: Test the palette helper
        run: |
          meson setup target/meson
          meson compile -C target/meson
          CAMINITO_GTK_PALETTE=$PWD/target/meson/helpers/caminito-gtk-palette/caminito-gtk-palette \
            xvfb-run -a cargo test -p caminito-theme --test palette_helper -- --ignored

      # caminito-locker's PAM conversation (131), against pam_wrapper's stand-in service.
      - name: Test the helpers
        run: meson test -C target/meson --print-errorlogs

      # A golden case that doesn't match writes Caminito's image and a diff beside it.
      - name: Keep golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: |
            tests/goldens/frames/**/*.caminito.png
            tests/goldens/frames/**/*.diff.png
          if-no-files-found: ignore

      # The headless tier renders with pixman, so it needs no GPU or EGL, and the X11 tier
      # runs with it. caminito's tests get a private session bus (14). The bus takes its home
      # from the user database (/root), and a container job's HOME is /github/home, so
      # XDG_DATA_HOME makes the bus read the service files that a test writes below HOME.
      - name: Test caminito
        run: XDG_DATA_HOME=$HOME/.local/share dbus-run-session -- cargo test -p caminito

      # The real caminito-locker against the headless fixture (131), which the palette step's
      # Meson build has built. Its password is checked by pam_wrapper's stand-in service.
      - name: Test caminito-locker against caminito
        run: |
          export CAMINITO_LOCKER=$PWD/target/meson/helpers/caminito-locker/caminito-locker
          export PAM_WRAPPER_MODULES=$(pkg-config --variable=modules pam_wrapper)
          XDG_DATA_HOME=$HOME/.local/share dbus-run-session -- \
            cargo test -p caminito tests::caminito_locker -- --ignored

  # The global menu extension (116): type-checked, tested on a private dbus-daemon of each
  # test's own, and bundled.
  extension:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install git, node and dbus
        run: pacman -Syu --noconfirm --needed git nodejs npm dbus

      - uses: actions/checkout@v5

      - name: Install the dependencies
        working-directory: caminito-vscode
        run: npm ci

      - name: Type-check
        working-directory: caminito-vscode
        run: npm run typecheck

      - name: Test
        working-directory: caminito-vscode
        run: npm test

      - name: Build the bundle
        working-directory: caminito-vscode
        run: npm run build

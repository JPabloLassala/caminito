name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install git
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v5

      - uses: ./.github/actions/arch-setup

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo-deny
        run: cargo deny check

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace --exclude camino

      # A golden case that doesn't match writes Camino's image and a diff beside it.
      - name: Keep golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: |
            tests/goldens/frames/**/*.camino.png
            tests/goldens/frames/**/*.diff.png
          if-no-files-found: ignore

      # The headless tier renders with pixman, so it needs no GPU or EGL. camino's tests
      # get a private session bus (14).
      - name: Test camino
        run: dbus-run-session -- cargo test -p camino

name: Weekly

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  smithay-canary:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install git
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v5

      - uses: ./.github/actions/arch-setup

      - name: Point Smithay at master
        run: |
          sed -i -E '/^smithay(-drm-extras)? = /{s/version = "[^"]+", //;s/rev = "[0-9a-f]+"/branch = "master"/}' Cargo.toml
          grep '^smithay = .*branch = "master"' Cargo.toml
          grep '^smithay-drm-extras = .*branch = "master"' Cargo.toml
          cargo update -p smithay -p smithay-drm-extras

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: |
          cargo test --workspace --exclude camino
          dbus-run-session -- cargo test -p camino

  smithay-canary-report:
    needs: smithay-canary
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the canary issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Smithay canary failing"
          body="The weekly build against Smithay master failed: $RUN_URL"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  # Each patched package's series on its component's upstream head (14, 16), so a patch
  # that stops applying or building is known before the baseline has to move.
  patches-on-head:
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - mate-session-manager-camino
    steps:
      - name: Install packages
        run: pacman -Syu --noconfirm --needed base-devel git

      - uses: actions/checkout@v5

      # makepkg refuses to run as root. The builder installs dependencies through sudo.
      - name: Add a build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >/etc/sudoers.d/builder
          chown -R builder: "$GITHUB_WORKSPACE"

      # A pinned commit becomes the default branch's head, and a tag does too.
      - name: Point the source at upstream's head
        working-directory: packaging/arch/${{ matrix.package }}
        run: |
          sed -i -E '/^source=\(/,/^\)/s/#(commit|tag)=[^"]*//' PKGBUILD
          if grep -E '#(commit|tag)=' PKGBUILD; then exit 1; fi

      # The pinned source's checksum doesn't hold for the head. pkgver() names what was built.
      - name: makepkg
        working-directory: packaging/arch/${{ matrix.package }}
        run: sudo -u builder makepkg --syncdeps --noconfirm --skipchecksums

  patches-on-head-report:
    needs: patches-on-head
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the patches issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Carried patches failing on upstream head"
          body="The weekly build of a patched package on its upstream head failed: $RUN_URL"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  proptest:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      PROPTEST_CASES: 200000
    steps:
      - name: Install git
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v5

      - uses: ./.github/actions/arch-setup

      - name: Property tests
        run: cargo test --release -p camino-policy

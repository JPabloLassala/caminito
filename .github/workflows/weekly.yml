name: Weekly

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      vscode-version:
        description: "The VS Code the menubar canary snapshots: a version such as 1.140.0, or latest"
        default: latest

jobs:
  smithay-canary:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install git
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v5

      - uses: ./.github/actions/arch-setup

      - name: Point Smithay at master
        run: |
          sed -i -E '/^smithay(-drm-extras)? = /{s/version = "[^"]+", //;s/rev = "[0-9a-f]+"/branch = "master"/}' Cargo.toml
          grep '^smithay = .*branch = "master"' Cargo.toml
          grep '^smithay-drm-extras = .*branch = "master"' Cargo.toml
          cargo update -p smithay -p smithay-drm-extras

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: |
          cargo test --workspace --exclude caminito
          dbus-run-session -- cargo test -p caminito

  smithay-canary-report:
    needs: smithay-canary
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the canary issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Smithay canary failing"
          body="The weekly build against Smithay master failed: $RUN_URL"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  # Each patched package's series on its component's upstream head (14, 16), so a patch
  # that stops applying or building is known before the baseline has to move.
  patches-on-head:
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - mate-session-manager-caminito
          - mate-panel-caminito
          - mate-settings-daemon-caminito
          - mate-control-center-caminito
          - caja-caminito
          - mate-utils-caminito
          - mate-power-manager-caminito
          - vala-panel-appmenu-mate-caminito
          - appmenu-gtk-module-caminito
    steps:
      - name: Install packages
        run: pacman -Syu --noconfirm --needed base-devel git

      - uses: actions/checkout@v5

      # makepkg refuses to run as root. The builder installs dependencies through sudo.
      - name: Add a build user
        run: |
          useradd -m builder
          # make runs one job unless makepkg is told otherwise.
          echo "MAKEFLAGS=-j$(nproc)" >/home/builder/.makepkg.conf
          chown builder: /home/builder/.makepkg.conf
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >/etc/sudoers.d/builder
          chown -R builder: "$GITHUB_WORKSPACE"

      # A pinned commit becomes the default branch's head, and a tag does too. A source
      # named -stock stays where it is: mate-panel-caminito's 1.28 applet library.
      - name: Point the source at upstream's head
        working-directory: packaging/arch/${{ matrix.package }}
        run: |
          sed -i -E '/^source=\(/,/^\)/{/-stock::/!s/#(commit|tag)=[^"]*//}' PKGBUILD
          if grep -v -e '-stock::' PKGBUILD | grep -E '#(commit|tag)='; then exit 1; fi

      # The pinned source's checksum doesn't hold for the head. pkgver() names what was built.
      - name: makepkg
        working-directory: packaging/arch/${{ matrix.package }}
        run: sudo -u builder makepkg --syncdeps --noconfirm --skipchecksums

  patches-on-head-report:
    needs: patches-on-head
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the patches issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Carried patches failing on upstream head"
          body="The weekly build of a patched package on its upstream head failed: $RUN_URL"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  # VS Code's menubar against the extension's menu table (ADR 0019, 123): the newest stable
  # build's snapshot, compared in structure with the committed table. The table is remade by
  # hand with `npm run snapshot`; nothing here commits.
  vscode-menubar-canary:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      # Docker's 64 MB /dev/shm is known to crash Chromium's renderers.
      options: --shm-size=1g
    steps:
      # Electron's libraries, as visual-studio-code-bin depends on them, and Xvfb.
      - name: Install packages
        run: >-
          pacman -Syu --noconfirm --needed git curl nodejs npm xorg-server-xvfb xorg-xauth
          gtk3 nss alsa-lib libxkbfile libsecret libxss libnotify mesa

      - uses: actions/checkout@v5

      # A scheduled run has no inputs. A dispatch can name the table's version, to check the job.
      - name: Download VS Code
        env:
          VERSION: ${{ inputs.vscode-version || 'latest' }}
        run: |
          mkdir -p "$RUNNER_TEMP/vscode"
          curl -fsSL "https://update.code.visualstudio.com/$VERSION/linux-x64/stable" \
            | tar -xz -C "$RUNNER_TEMP/vscode" --strip-components=1

      - name: Install the dependencies
        working-directory: caminito-vscode
        run: npm ci

      # The diff goes to the report job's issue.
      - name: Snapshot and compare
        working-directory: caminito-vscode
        shell: bash
        run: |
          set -o pipefail
          node tools/snapshot.mts --editor "$RUNNER_TEMP/vscode" --check \
            | tee "$RUNNER_TEMP/menubar.diff"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: menubar-diff
          path: ${{ runner.temp }}/menubar.diff
          if-no-files-found: ignore

  vscode-menubar-canary-report:
    needs: vscode-menubar-canary
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # None when the snapshot didn't get as far as comparing.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: menubar-diff

      - name: Open or update the menubar issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="VS Code menubar canary failing"
          {
            echo "The weekly snapshot of VS Code's newest stable build failed: $RUN_URL"
            echo
            if [ -s menubar.diff ]; then
              echo "Its menubar differs from \`caminito-vscode/menu/table.json\`. Remake the table with \`npm run snapshot\` (ADR 0019)."
              echo
              echo '```diff'
              head -c 60000 menubar.diff
              echo
              echo '```'
            else
              echo "It didn't get as far as comparing, so there's no diff."
            fi
          } >body.md
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi

  proptest:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      PROPTEST_CASES: 200000
    steps:
      - name: Install git
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v5

      - uses: ./.github/actions/arch-setup

      - name: Property tests
        run: cargo test --release -p caminito-policy -p caminito-layout

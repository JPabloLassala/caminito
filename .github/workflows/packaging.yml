name: Packaging

# The longest workflow, about 30 minutes of metered Actions time a run. It runs when a
# PKGBUILD reaches master or a pull request, by hand, and weekly, which catches what the
# packages build from outside packaging/arch (caminito-git's and caminito-vscode-git's
# sources, Arch's own packages).
on:
  push:
    branches: [master]
    paths:
      - "packaging/arch/**"
      - ".github/workflows/packaging.yml"
  pull_request:
    paths:
      - "packaging/arch/**"
      - ".github/workflows/packaging.yml"
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      # In dependency order. Each package is installed as it's built, so the next one builds
      # against it. The patched packages come before caminito-git, which depends on them (16),
      # and caminito-desktop, the meta package, depends on caminito-git. mate-utils-caminito's
      # dictionary applet, mate-power-manager-caminito's applets and
      # vala-panel-appmenu-mate-caminito's link mate-panel-caminito's applet library.
      # tools/bootstrap has the same order, without vala-panel-appmenu-mate-caminito,
      # appmenu-gtk-module-caminito and caminito-vscode-git, which nothing depends on (ADR 0017,
      # ADR 0022).
      PACKAGES: >-
        mate-session-manager-caminito
        mate-panel-caminito
        mate-settings-daemon-caminito
        mate-control-center-caminito
        caja-caminito
        mate-utils-caminito
        mate-power-manager-caminito
        vala-panel-appmenu-mate-caminito
        appmenu-gtk-module-caminito
        caminito-vscode-git
        caminito-git
        caminito-desktop
    steps:
      # rustup provides cargo, so makepkg doesn't pull in the rust package.
      - name: Install packages
        run: pacman -Syu --noconfirm --needed base-devel git namcap rustup

      # caminito-git's pkgver() needs the history and tags.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # makepkg refuses to run as root. The builder installs dependencies through sudo.
      - name: Add a build user
        run: |
          useradd -m builder
          # make runs one job unless makepkg is told otherwise.
          echo "MAKEFLAGS=-j$(nproc)" >/home/builder/.makepkg.conf
          chown builder: /home/builder/.makepkg.conf
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >/etc/sudoers.d/builder
          chown -R builder: "$GITHUB_WORKSPACE"
          sudo -u builder rustup toolchain install stable --profile minimal

      # namcap exits 0 whatever it finds, so its errors are grepped for. Warnings are
      # printed for review. It reads the PKGBUILD as builder, so git trusts the checkout
      # that caminito-git's source=() reads. makepkg also makes a -debug package for C code, which
      # isn't checked.
      - name: Build and check each package
        shell: bash
        run: |
          for package in $PACKAGES; do
            echo "::group::$package"
            cd "$GITHUB_WORKSPACE/packaging/arch/$package"
            sudo -u builder namcap PKGBUILD | tee namcap.log
            if grep -q ' E: ' namcap.log; then exit 1; fi
            sudo -u builder makepkg --syncdeps --install --noconfirm
            namcap $(ls ./*.pkg.tar.zst | grep -v -- '-debug-') | tee namcap.log
            if grep -q ' E: ' namcap.log; then exit 1; fi
            echo "::endgroup::"
          done

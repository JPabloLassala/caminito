name: Arch setup
description: Install Camino's build dependencies and Rust toolchain in the archlinux container.

runs:
  using: composite
  steps:
    # Only what the build needs so far; later tickets add packages here.
    - name: Install packages
      shell: bash
      # pixman: the headless backend links it in test builds. The winit build
      # dlopens EGL, Wayland and X11 at run time, so it links nothing new.
      run: pacman -Syu --noconfirm --needed gcc rustup cargo-deny libxkbcommon pixman

    - name: Install Rust toolchain
      shell: bash
      run: rustup toolchain install

    - uses: Swatinem/rust-cache@v2

<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The theme goldens' private fontconfig (14, ADR 0009): FONTCONFIG_FILE points here, so
     the only font either side sees is the one in this directory, whatever the machine has
     installed. The rendering options repeat the ones cases.json pins, for anything that
     reads them from fontconfig rather than from cairo's font options. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir prefix="xdg">camino-test-fontconfig</cachedir>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>

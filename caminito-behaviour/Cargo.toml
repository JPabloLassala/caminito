[package]
name = "caminito-behaviour"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Shipped through the PKGBUILD (16), never crates.io.
publish = false

# The library reads and writes the keys through gio, and the templates' files, and names no
# toolkit. GTK is the window's, the binary's.
[dependencies]
# The answer of the page's dialog that asks for a name, awaited.
futures-channel.workspace = true
gio = "0.22.10"
# The open windows' app ids, for the Key remaps page's list (CMN-189), through
# ext-foreign-toplevel-list, which is staging's.
wayland-client.workspace = true
wayland-protocols = { workspace = true, features = ["client", "staging"] }
# The window, without libadwaita (ADR 0014). v4_12: CSS from a string.
gtk = { workspace = true, features = ["v4_12"] }

[dev-dependencies]
# The schema compiled from data/ into a directory of the test's own.
tempfile = "3.27.0"

[lints]
workspace = true

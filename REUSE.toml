# The PKGBUILDs of the patched packages, taken from Arch's and the AUR's, whose packaging is
# 0BSD. The contributors are named in each PKGBUILD.
[[annotations]]
path = [
  "packaging/arch/appmenu-gtk-module-caminito/**",
  "packaging/arch/caja-caminito/**",
  "packaging/arch/mate-control-center-caminito/**",
  "packaging/arch/mate-panel-caminito/**",
  "packaging/arch/mate-power-manager-caminito/**",
  "packaging/arch/mate-session-manager-caminito/**",
  "packaging/arch/mate-settings-daemon-caminito/**",
  "packaging/arch/mate-utils-caminito/**",
  "packaging/arch/vala-panel-appmenu-mate-caminito/**",
]

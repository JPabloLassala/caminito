version = 1
SPDX-PackageName = "Caminito"
SPDX-PackageSupplier = "Juan Pablo Lassala <jpablolassala@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/JPabloLassala/caminito"

# Each path's licence and copyright (ADR 0051). Where annotations overlap, the last one wins,
# so Caminito's own default comes first and the third parties' files follow it. A file with
# an SPDX header of its own (anvil's, niri's, Marco's and mate-screensaver's code) is read
# from its header.

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2025-2026 Juan Pablo Lassala"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Caminito's own protocol is MIT, as Wayland protocols are, so that any client can implement it.
[[annotations]]
path = "caminito/resources/caminito-intellihide-v1.xml"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Juan Pablo Lassala"
SPDX-License-Identifier = "MIT"

# The protocols vendored from other projects, with the notices in their files.
[[annotations]]
path = "caminito/resources/gtk-shell.xml"
precedence = "closest"
SPDX-FileCopyrightText = "The GTK developers"
SPDX-License-Identifier = "LGPL-2.0-or-later"

[[annotations]]
path = "caminito/resources/xfce-foreign-toplevel-management-private-v1.xml"
precedence = "closest"
SPDX-FileCopyrightText = "2024 Brian Tarricone <brian@tarricone.org>"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "helpers/caminito-dock-applet/protocols/xdg-activation-v1.xml"
precedence = "closest"
SPDX-FileCopyrightText = [
  "2020 Aleix Pol Gonzalez <aleixpol@kde.org>",
  "2020 Carlos Garnacho <carlosg@gnome.org>",
]
SPDX-License-Identifier = "MIT"

# mate-screensaver's unlock dialog. Its C files carry their headers.
[[annotations]]
path = "helpers/caminito-locker/lock-dialog-default.ui"
precedence = "closest"
SPDX-FileCopyrightText = ["2012-2021 MATE Developers", "2025-2026 Juan Pablo Lassala"]
SPDX-License-Identifier = "GPL-2.0-or-later"

# Converted from Toshy's config, which is based on Kinto's (ADR 0038). Toshy's licence has no
# "or later".
[[annotations]]
path = "data/remap-templates/macos-pc.remaps"
precedence = "closest"
SPDX-FileCopyrightText = [
  "RedBearAK, the author of Toshy <https://github.com/RedBearAK/toshy>",
  "Ben Reaves, the author of Kinto <https://github.com/rbreaves/kinto>",
]
SPDX-License-Identifier = "GPL-3.0-only"

# VS Code's menu labels and commands, from its lastKnownMenubarData (ADR 0019).
[[annotations]]
path = "caminito-vscode/menu/table.json"
precedence = "closest"
SPDX-FileCopyrightText = "Microsoft Corporation"
SPDX-License-Identifier = "MIT"

# Matt Pocock's skills (see LICENSE-mattpocock-skills), with the developer's changes. The ship
# skill is the developer's own.
[[annotations]]
path = ".claude/skills/**"
precedence = "closest"
SPDX-FileCopyrightText = ["2026 Matt Pocock", "2026 Juan Pablo Lassala"]
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ".claude/skills/ship/**"
precedence = "closest"
SPDX-FileCopyrightText = "2025-2026 Juan Pablo Lassala"
SPDX-License-Identifier = "GPL-3.0-or-later"


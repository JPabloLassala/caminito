SPDX-FileCopyrightText = ["Arch Linux contributors", "2025-2026 Juan Pablo Lassala"]
SPDX-License-Identifier = "0BSD"

# The Fedora specs of the patched packages, taken from Fedora's, whose spec files are MIT
# under the Fedora Project Contributor Agreement. Fedora's patches are to MATE's code, so they
# are under its licence.
[[annotations]]
path = [
  "packaging/fedora/caja/**",
  "packaging/fedora/marco/**",
  "packaging/fedora/mate-control-center/**",
  "packaging/fedora/mate-panel/**",
  "packaging/fedora/mate-power-manager/**",
  "packaging/fedora/mate-session-manager/**",
  "packaging/fedora/mate-settings-daemon/**",
  "packaging/fedora/mate-utils/**",
]
precedence = "closest"
SPDX-FileCopyrightText = ["Fedora Project contributors", "2025-2026 Juan Pablo Lassala"]
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "packaging/fedora/*/*.patch"
precedence = "closest"
SPDX-FileCopyrightText = ["MATE Developers", "Fedora Project contributors"]
SPDX-License-Identifier = "GPL-2.0-or-later"

# The carried patches (ADR 0030) are Caminito's own. Their context lines can hold upstream's
# notices, which REUSE reads as well.
[[annotations]]
path = "packaging/patches/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025-2026 Juan Pablo Lassala"
SPDX-License-Identifier = "GPL-3.0-or-later"

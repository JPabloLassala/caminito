[package]
name = "caminito"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Shipped through the PKGBUILD (16), never crates.io.
publish = false

[dependencies]
# The wait for the restarted portal (CMN-284), on zbus's executor: zbus's own timer and
# combinator, as zbus already depends on them.
async-io = "2.6.0"
caminito-layout = { path = "../caminito-layout" }
caminito-policy = { path = "../caminito-policy" }
caminito-theme = { path = "../caminito-theme" }
# The version string `--version` prints, which caminito-about shows too (182).
caminito-version = { path = "../caminito-version" }
# GAMMA_LUT's blob of a CRTC's size, which drm's `create_property_blob` can't make from a
# slice (137). Smithay's drm already depends on it.
drm-ffi = "0.9.1"
futures-channel.workspace = true
futures-lite = "2.6.1"
gio = "0.22.10"
libc = "0.2.189"
# process: SIGTERM to the helpers and to the session command (61), and Force Quit's SIGKILL
# (168). system: the machine's name, for an XWayland window's `WM_CLIENT_MACHINE` (168).
rustix = { workspace = true, features = ["fs", "process", "system"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json.workspace = true
signal-hook = "0.4.4"
smithay = { workspace = true, features = [
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_winit",
    "desktop",
    "renderer_gl",
    "wayland_frontend",
    "xwayland",
] }
# EDIDs' make, model and serial, through libdisplay-info.
smithay-drm-extras = { workspace = true, features = ["display-info"] }
tracing = "0.1.44"
# A Session's logs, when its stderr isn't a terminal (14).
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Generates gtk_shell1 and Xfce's foreign toplevel protocol from the XML in `resources/`
# (15, 67, 75).
wayland-scanner = "0.31.11"
# Caminito's X connection (11, 15), beside Smithay's.
x11rb = { workspace = true, features = ["randr", "shape", "xkb"] }
xcursor = "0.3.11"
zbus = "5.19.0"

[dev-dependencies]
# Its page and its client of output management, which the headless tests drive against
# Caminito (84).
caminito-displays = { path = "../caminito-displays" }
caminito-test-client = { path = "../caminito-test-client" }
# The Wallpaper dialog's client of output management and its page, which the headless tests
# drive against Caminito (212).
caminito-wallpaper = { path = "../caminito-wallpaper" }
insta = "1.48.0"
# The stand-in logind's inhibitor pipes, and whether Caminito closed its end (130).
rustix = { workspace = true, features = ["event", "pipe"] }
tempfile = "3.27.0"
# The headless backend is `cfg(test)` (15), so pixman stays out of the release build.
smithay = { workspace = true, features = ["renderer_pixman"] }

[lints]
workspace = true

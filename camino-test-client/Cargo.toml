[package]
name = "camino-test-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
rustix = { version = "1.1.5", features = ["fs", "pipe"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
# gtk_shell1 and Xfce's foreign toplevel protocol, from the XML Camino vendors (67, 75).
wayland-scanner = "0.31.11"
x11rb = { workspace = true, features = ["randr", "shape"] }
zbus = "5.19.0"

[lints]
workspace = true

[package]
name = "camino-theme"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gdk-pixbuf = "0.22.0"
pango = "0.22.9"
pangocairo = "0.22.9"

[dev-dependencies]
# The goldens are PNGs.
cairo-rs = { version = "0.22.9", features = ["png"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
tempfile = "3.27.0"

# Its own main sets FONTCONFIG_FILE before any thread starts.
[[test]]
name = "goldens"
harness = false

[lints]
workspace = true

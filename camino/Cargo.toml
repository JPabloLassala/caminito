[package]
name = "camino"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Shipped through the PKGBUILD (16), never crates.io.
publish = false

[dependencies]
camino-layout = { path = "../camino-layout" }
camino-policy = { path = "../camino-policy" }
camino-theme = { path = "../camino-theme" }
futures-channel = "0.3.34"
gio = "0.22.10"
# process: SIGTERM to the helpers and to the session command (61).
rustix = { version = "1.1.5", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"
smithay = { workspace = true, features = [
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_winit",
    "desktop",
    "renderer_gl",
    "wayland_frontend",
    "xwayland",
] }
# EDIDs' make, model and serial, through libdisplay-info.
smithay-drm-extras = { workspace = true, features = ["display-info"] }
tracing = "0.1.44"
# A Session's logs, when its stderr isn't a terminal (14).
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Generates gtk_shell1 and Xfce's foreign toplevel protocol from the XML in `resources/`
# (15, 67, 75).
wayland-scanner = "0.31.11"
# Camino's X connection (11, 15), beside Smithay's.
x11rb = { workspace = true, features = ["randr", "shape", "xkb"] }
xcursor = "0.3.11"
zbus = "5.19.0"

[dev-dependencies]
camino-test-client = { path = "../camino-test-client" }
insta = "1.48.0"
tempfile = "3.27.0"
# The headless backend is `cfg(test)` (15), so pixman stays out of the release build.
smithay = { workspace = true, features = ["renderer_pixman"] }

[lints]
workspace = true

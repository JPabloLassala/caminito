[package]
name = "camino"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Shipped through the PKGBUILD (16), never crates.io.
publish = false

[dependencies]
camino-policy = { path = "../camino-policy" }
camino-theme = { path = "../camino-theme" }
gio = "0.22.10"
rustix = { version = "1.1.5", features = ["fs"] }
signal-hook = "0.4.4"
smithay = { workspace = true, features = ["backend_winit", "desktop", "wayland_frontend"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
xcursor = "0.3.11"

[dev-dependencies]
camino-test-client = { path = "../camino-test-client" }
insta = "1.48.0"
tempfile = "3.27.0"
# The headless backend is `cfg(test)` (15), so pixman stays out of the release build.
smithay = { workspace = true, features = ["renderer_pixman"] }

[package]
name = "caminito-notifications"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Shipped through the PKGBUILD, never crates.io.
publish = false

# The library is the Desktop Notifications server over gio's D-Bus (ADR 0051), with no zbus,
# and names no toolkit. Only the binary uses GTK, and libcanberra for the sounds.
[dependencies]
gio = "0.22.10"
# The bubbles, without libadwaita (ADR 0014).
gtk = { workspace = true, features = ["v4_12"] }
# The bubbles' layer surfaces.
gtk4-layer-shell = "0.8.1"

[lints]
workspace = true

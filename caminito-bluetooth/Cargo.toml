[package]
name = "caminito-bluetooth"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Shipped through the PKGBUILD, never crates.io.
publish = false

# The library is BlueZ's model over gio's D-Bus (ADR 0035), with no zbus (the spec's "The
# two pieces"), and names no toolkit. Only the binary uses GTK.
[dependencies]
gio = "0.22.10"
# The application and its window, without libadwaita (ADR 0014).
gtk.workspace = true

[dev-dependencies]
# The fake sysfs and rfkill device of SystemRfkill's tests.
tempfile = "3.27.0"

[lints]
workspace = true
